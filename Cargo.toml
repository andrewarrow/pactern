[workspace]
members = ["crates/pactern", "crates/pactern-cli", "crates/pactern-baseline"]
default-members = ["crates/pactern", "crates/pactern-cli", "crates/pactern-baseline"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"
